[package]
name = "profiler"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A local-first personality intelligence and communication coaching TUI app"
license = "MIT"

[dependencies]
# TUI
ratatui = "0.26"
crossterm = "0.27"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Config
toml = "0.8"

# Text processing
regex = "1.10"
unicode-segmentation = "1.11"

# Browser automation (Firefox via WebDriver/geckodriver)
fantoccini = "0.21"

# Read Firefox cookies for authenticated scraping
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
mockito = "1.2"

[[bin]]
name = "profiler"
path = "src/main.rs"
